{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <title>Órdenes de trabajo</title>
        <link rel="stylesheet" href="{% static 'hello/css/styles.css' %}">
    </head>
    <body>
        <h2>Crear Usuario</h2>
        <form method="POST">
            <!-- Django lo necesita para poder enviar formularios con POST -->
            {% csrf_token %}
            <div>
                <label>Nombre</label>
                <input type="text" name="name" required>
            </div>
            <br>
            <div>
                <label>Cuenta</label>
                <input type="text" name="account" required>
            </div>
            <br>
            <div>
                <label>Perfil</label>
                <select name="profile">
                    <option value="1">Administrador</option>
                    <option value="2">Operador</option>
                </select>
            </div>
            <br>
            <button type="submit">Guardar</button>
        </form>

        <hr>

        <h1>Consulta de Usuarios</h1>
        <table class="table-user">
            <!-- thead (Table Head) -->
            <thead>
                <!-- tr (table row) -->
                <tr>
                    <th>Nombre</th>
                    <th>Cuenta</th>
                    <th>Perfil</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                    <tr>
                        <!-- td (Table Data) -->
                        <td>{{ user.name }}</td>
                        <td>{{ user.account }}</td>
                        <td>{{ user.profile.name }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
        <br><br>
        <script src="{% static 'hello/js/scripts.js' %}"></script>
    </body>
</html>
