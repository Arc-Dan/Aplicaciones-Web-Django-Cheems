{% load static %}
<!DOCTYPE html>
<html>
    <head>
        <title>Órdenes de trabajo</title>
        <link rel="stylesheet" href="{% static 'hello/css/styles.css' %}">
    </head>
    <body>
        <h1>Consulta de Usuarios</h1>
        <table class="table-user">
            <!-- thead (Table Head) -->
            <thead>
                <!-- tr (table row) -->
                <tr>
                    <th>Nombre</th>
                    <th>Cuenta</th>
                    <th>Perfil</th>
                </tr>
            </thead>
            <tbody>
                {% for user in users %}
                    <tr>
                        <!-- td (Table Data) -->
                        <td>{{ user.name }}</td>
                        <td>{{ user.account }}</td>
                        <td>{{ user.profile.name }}</td>
                    </tr>
                {% endfor %}
            </tbody>
        </table>
        <br><br>
        <script src="{% static 'hello/js/scripts.js' %}"></script>
    </body>
</html>
